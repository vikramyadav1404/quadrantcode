name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    # DIAGNOSTIC BRANCH ONLY (issue #26): skipped to spend CI minutes on the experiment.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Constraint and index tests need a real Postgres — CHECK constraints,
    # partial unique indexes, triggers and query plans cannot be verified
    # against a mock. Locally the same suites run against the embedded
    # Postgres from `npm run test:db:start`.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quadrantcode_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quadrantcode_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/quadrantcode_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quadrantcode_test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: ci-build-secret-that-is-longer-than-thirty-two-characters

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, so the full history must be present.
          fetch-depth: 0

      # Secrets must never enter history — git rm --cached does not undo a push.
      #
      # The official action is deliberately NOT used: on a push it derives a
      # commit range of `<before>^..<after>`, and on the first push `<before>`
      # is the root commit, whose `^` is an unknown revision — the scan aborts
      # with "ambiguous argument" and the job fails without having scanned
      # anything. Invoking the binary directly with `--log-opts=--all` scans the
      # entire history every run and matches what developers run locally.
      - name: Secret scan (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts="--all" --config .gitleaks.toml --redact --verbose

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Fails the build if any token pair drops below its WCAG threshold.
      - name: Contrast audit
        run: npm run contrast

      - name: Test
        run: npm test

      - name: Deployment environment contract
        run: npm run deploy:check
        env:
          NEXT_PUBLIC_APP_URL: https://ci.quadrantcode.example
          GITHUB_ID: ci-client-id
          GITHUB_SECRET: ci-client-secret
          UPSTASH_REDIS_REST_URL: https://ci-rate-limit.example
          UPSTASH_REDIS_REST_TOKEN: ci-rate-limit-token
          SENTRY_DSN: https://public@errors.example/1
          NEXT_PUBLIC_SENTRY_DSN: https://public@errors.example/1
          NEXT_PUBLIC_SUPPORT_EMAIL: support@quadrantcode.example

      # Proves the server-only boundary: a client component importing server/
      # fails here even if someone disabled the ESLint rule.
      - name: Build
        run: npm run build

  # SEPARATE JOB, deliberately: browser tests are slower and flakier than the
  # unit suite, and gating merges on both in one job means a Chromium hiccup
  # blocks a green typecheck. This job may be marked non-required in branch
  # protection without weakening the unit gate.
  e2e:
    name: browser (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quadrantcode_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quadrantcode_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/quadrantcode_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quadrantcode_test
      AUTH_SECRET: e2e-ci-secret-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:3210

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Migrate
        run: npm run db:migrate

      # DIAGNOSTIC BRANCH ONLY (issue #26): two builds, one spec, 20 repeats each.
      - name: Build (default prefetch)
        run: npm run build

      - name: Experiment E1 + E2 (default prefetch)
        run: |
          DIAG_MODE=default npx playwright test e2e/diag-start-race.spec.ts \
            --repeat-each=20 --reporter=list 2>&1 | tee diag-default.log || true

      - name: Build (prefetch disabled)
        run: NEXT_PUBLIC_DIAG_NO_PREFETCH=1 npm run build

      - name: Experiment E3 + E2 (prefetch disabled)
        run: |
          DIAG_MODE=no-prefetch npx playwright test e2e/diag-start-race.spec.ts \
            --repeat-each=20 --reporter=list 2>&1 | tee diag-no-prefetch.log || true

      - name: Summary
        if: always()
        run: |
          {
            echo '## DIAG rows'
            echo '```'
            grep -h '^DIAG ' diag-default.log diag-no-prefetch.log || true
            echo '```'
            echo '## DIAG-LOG (console / pageerror / requestfailed)'
            echo '```'
            grep -h '^DIAG-LOG ' diag-default.log diag-no-prefetch.log | sort | uniq -c | sort -rn | head -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-logs
          path: |
            diag-default.log
            diag-no-prefetch.log
            .playwright/results
          retention-days: 7
