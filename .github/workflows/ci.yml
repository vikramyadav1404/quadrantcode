name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Constraint and index tests need a real Postgres — CHECK constraints,
    # partial unique indexes, triggers and query plans cannot be verified
    # against a mock. Locally the same suites run against the embedded
    # Postgres from `npm run test:db:start`.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traceloop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traceloop_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/traceloop_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traceloop_test
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, so the full history must be present.
          fetch-depth: 0

      # Secrets must never enter history — git rm --cached does not undo a push.
      #
      # The official action is deliberately NOT used: on a push it derives a
      # commit range of `<before>^..<after>`, and on the first push `<before>`
      # is the root commit, whose `^` is an unknown revision — the scan aborts
      # with "ambiguous argument" and the job fails without having scanned
      # anything. Invoking the binary directly with `--log-opts=--all` scans the
      # entire history every run and matches what developers run locally.
      - name: Secret scan (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts="--all" --config .gitleaks.toml --redact --verbose

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Fails the build if any token pair drops below its WCAG threshold.
      - name: Contrast audit
        run: npm run contrast

      - name: Test
        run: npm test

      # Proves the server-only boundary: a client component importing server/
      # fails here even if someone disabled the ESLint rule.
      - name: Build
        run: npm run build
