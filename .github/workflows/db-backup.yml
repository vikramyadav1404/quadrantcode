name: Database backup

# Daily logical backup of the production Neon database. Neon's free plan keeps
# only six hours of history, so this is the copy that survives a mistake found
# the next day. scripts/db-backup.sh does the work; docs/db-backup.md has the
# restore steps.
#
# The repository is public and anyone signed in to GitHub can download its
# artifacts, so only the AES-256 encrypted file is uploaded. Lose
# BACKUP_PASSPHRASE and every backup is unreadable.

on:
  schedule:
    - cron: '43 20 * * *' # 02:13 IST
  workflow_dispatch:

permissions:
  contents: read
  actions: write # re-enable the scheduled workflows, see the last step

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5

      - name: Refuse missing secrets
        run: |
          test -n "$DB_URL" || { echo "::error::DIRECT_DATABASE_URL is not set"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::BACKUP_PASSPHRASE is not set"; exit 1; }
          test "${#BACKUP_PASSPHRASE}" -ge 16 || { echo "::error::BACKUP_PASSPHRASE must be at least 16 characters"; exit 1; }

      - name: Install a Postgres client matching the server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client > /dev/null
          num="$(psql "$DB_URL" -X -A -t -c 'show server_version_num')"
          major=$((num / 10000))
          sudo apt-get install -y -qq "postgresql-client-$major" > /dev/null
          echo "PGBIN=/usr/lib/postgresql/$major/bin" >> "$GITHUB_ENV"
          echo "PGMAJOR=$major" >> "$GITHUB_ENV"
          echo "Server major version $major"

      - name: Start a throwaway Postgres for the restore test
        run: |
          docker run -d --name restore-check -p 127.0.0.1:55432:5432 \
            -e POSTGRES_PASSWORD=restore-check -e POSTGRES_DB=restore_check \
            "postgres:$PGMAJOR" > /dev/null
          for _ in $(seq 1 30); do
            "$PGBIN/pg_isready" -q -h 127.0.0.1 -p 55432 && exit 0
            sleep 2
          done
          echo "::error::throwaway Postgres did not start"
          exit 1

      - name: Dump, verify by restoring, encrypt
        id: backup
        env:
          RESTORE_URL: postgresql://postgres:restore-check@127.0.0.1:55432/restore_check
          OUT_DIR: ${{ runner.temp }}/backup
        run: bash scripts/db-backup.sh

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.backup.outputs.name }}
          path: ${{ runner.temp }}/backup/
          if-no-files-found: error
          retention-days: 35
          compression-level: 0

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling them through the API resets that clock.
      - name: Keep the scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in db-backup.yml uptime.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" --silent \
              || echo "::warning::could not re-enable $wf"
          done
